name: Setup Restish
description: Build and install the pinned Restish revision required by the Realmroot plugin

inputs:
  repository:
    description: Restish Git repository
    required: false
    default: https://github.com/saltbo/restish.git
  revision:
    description: Full Restish commit SHA
    required: false
    default: dd52ecc03cdd0fcc7bd4b44aee30efc6c67ff84b

runs:
  using: composite
  steps:
    - name: Cache Restish
      id: cache-restish
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/restish/${{ inputs.revision }}
        key: restish-${{ runner.os }}-${{ runner.arch }}-${{ inputs.revision }}

    - name: Build Restish
      if: steps.cache-restish.outputs.cache-hit != 'true'
      shell: bash
      env:
        RESTISH_REPOSITORY: ${{ inputs.repository }}
        RESTISH_REVISION: ${{ inputs.revision }}
        RESTISH_INSTALL_DIR: ${{ runner.temp }}/restish/${{ inputs.revision }}
      run: |
        set -euo pipefail
        source_dir="${RUNNER_TEMP}/restish-source"
        mkdir -p "$RESTISH_INSTALL_DIR"
        git init "$source_dir"
        git -C "$source_dir" remote add origin "$RESTISH_REPOSITORY"
        git -C "$source_dir" fetch --depth 1 origin "$RESTISH_REVISION"
        git -C "$source_dir" checkout --detach FETCH_HEAD
        test "$(git -C "$source_dir" rev-parse HEAD)" = "$RESTISH_REVISION"
        go -C "$source_dir" build -trimpath -o "$RESTISH_INSTALL_DIR/restish" ./cmd/restish

    - name: Install Restish
      shell: bash
      env:
        RESTISH_INSTALL_DIR: ${{ runner.temp }}/restish/${{ inputs.revision }}
      run: |
        set -euo pipefail
        test -x "$RESTISH_INSTALL_DIR/restish"
        sudo install "$RESTISH_INSTALL_DIR/restish" /usr/local/bin/restish
        restish --version
