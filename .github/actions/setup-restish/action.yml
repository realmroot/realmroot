name: Setup Restish
description: Build and install the pinned Restish revision required by the Realmroot plugin

inputs:
  repository:
    description: Restish Git repository
    required: false
    default: https://github.com/saltbo/restish.git
  revision:
    description: Full Restish commit SHA
    required: false
    default: dd52ecc03cdd0fcc7bd4b44aee30efc6c67ff84b

runs:
  using: composite
  steps:
    - name: Install Restish
      shell: bash
      env:
        RESTISH_REPOSITORY: ${{ inputs.repository }}
        RESTISH_REVISION: ${{ inputs.revision }}
      run: |
        set -euo pipefail
        install_dir="${RUNNER_TEMP}/restish-setup"
        git init "$install_dir"
        git -C "$install_dir" remote add origin "$RESTISH_REPOSITORY"
        git -C "$install_dir" fetch --depth 1 origin "$RESTISH_REVISION"
        git -C "$install_dir" checkout --detach FETCH_HEAD
        test "$(git -C "$install_dir" rev-parse HEAD)" = "$RESTISH_REVISION"
        go -C "$install_dir" build -trimpath -o "$install_dir/restish" ./cmd/restish
        sudo install "$install_dir/restish" /usr/local/bin/restish
        restish --version
