name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.2

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24.14.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Lint architecture
        run: pnpm run lint:arch

      - name: Verify specs
        run: pnpm run spec:check

      - name: Migrations up to date
        run: |
          pnpm run db:generate
          if [ -n "$(git status --porcelain migrations)" ]; then
            echo "::error::schema.ts changed without a committed migration. Run pnpm db:generate and commit migrations/."
            git status --porcelain migrations
            exit 1
          fi

      - name: Build
        run: pnpm run build

  backend-unit:
    name: Backend unit coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.2

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24.14.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test backend unit layer with coverage
        run: pnpm run test:coverage:backend

      - name: Upload backend coverage
        uses: codecov/codecov-action@v6
        with:
          files: ./coverage/lcov.info
          flags: backend
          name: backend-unit
          fail_ci_if_error: false
          use_oidc: true

  web:
    name: Web unit coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.2

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24.14.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test Web unit layer with coverage
        run: pnpm run test:coverage:web

      - name: Upload Web coverage
        uses: codecov/codecov-action@v6
        with:
          files: ./coverage/lcov.info
          flags: web
          name: web-unit
          fail_ci_if_error: false
          use_oidc: true

  integration:
    name: Workerd and D1 integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.2

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24.14.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test integration crown
        run: pnpm run test:integration

  restish-plugin:
    name: Restish plugin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: plugins/restish-realmroot/go.mod
          cache-dependency-path: plugins/restish-realmroot/go.sum

      - name: Test Restish plugin
        run: cd plugins/restish-realmroot && go test ./...

  journeys:
    name: Playwright E2E (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.2

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24.14.1
          cache: pnpm

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: plugins/restish-realmroot/go.mod
          cache-dependency-path: plugins/restish-realmroot/go.sum

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Restish
        uses: ./.github/actions/setup-restish

      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: playwright-${{ runner.os }}-${{ runner.arch }}-

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Playwright E2E
        run: pnpm exec playwright test --shard=${{ matrix.shard }}/2

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

  verify:
    name: Verify
    if: always()
    needs: [quality, backend-unit, web, integration, restish-plugin]
    runs-on: ubuntu-latest
    steps:
      - name: Check verification jobs
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
      - name: Verification passed
        run: echo "All verification jobs passed."

  journeys-complete:
    name: Playwright E2E
    if: always()
    needs: journeys
    runs-on: ubuntu-latest
    steps:
      - name: Check E2E shards
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
      - name: E2E passed
        run: echo "All E2E shards passed."
