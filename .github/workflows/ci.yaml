name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.2

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24.14.1
          cache: pnpm

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: plugins/restish-realmroot/go.mod
          cache-dependency-path: plugins/restish-realmroot/go.sum

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Restish
        uses: ./.github/actions/setup-restish

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Lint architecture
        run: pnpm run lint:arch

      - name: Migrations up to date
        run: |
          pnpm run db:generate
          if [ -n "$(git status --porcelain migrations)" ]; then
            echo "::error::schema.ts changed without a committed migration. Run pnpm db:generate and commit migrations/."
            git status --porcelain migrations
            exit 1
          fi

      # v8 coverage can't instrument the workerd pool, so unit+web run with
      # coverage here and the integration crown runs separately — each test runs
      # once (no double run across jobs).
      - name: Test (unit + web, with coverage)
        run: pnpm run test:coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v6
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: true
          use_oidc: true

      - name: Test (integration crown)
        run: pnpm run test:integration

      - name: Test Restish plugin
        run: pnpm run plugin:test

      - name: Build
        run: pnpm run build

  journeys:
    name: Playwright E2E
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.2

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24.14.1
          cache: pnpm

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: plugins/restish-realmroot/go.mod
          cache-dependency-path: plugins/restish-realmroot/go.sum

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Restish
        uses: ./.github/actions/setup-restish

      - name: Verify specs
        run: pnpm run spec:check

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Playwright E2E
        run: pnpm run e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
