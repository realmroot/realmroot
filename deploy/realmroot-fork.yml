name: Deploy Realmroot Fork

# Install this file as .github/workflows/deploy.yml in a deployment fork.
# The canonical saltbo/realmroot repository does not use this workflow.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: realmroot-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deployment fork
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.30.2

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24.14.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          CREDENTIAL_ENCRYPTION_KEY: ${{ secrets.CREDENTIAL_ENCRYPTION_KEY }}
          PROVIDER_CONNECTION_EVENT_SECRETS: ${{ secrets.PROVIDER_CONNECTION_EVENT_SECRETS }}
          REALMROOT_WORKER_NAME: ${{ vars.REALMROOT_WORKER_NAME }}
          REALMROOT_D1_DATABASE: ${{ vars.REALMROOT_D1_DATABASE }}
          REALMROOT_R2_BUCKET: ${{ vars.REALMROOT_R2_BUCKET }}
        run: pnpm run deploy:fork
